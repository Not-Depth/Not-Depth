<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Wayfinding sign for Johnny Chen, Computer Science, University at Buffalo, with his name repeated in braille. A route runs from You are here to Next stop: Summer 2027 internship.">
  <!-- Text set in Atkinson Hyperlegible Next, Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, SIL Open Font License 1.1 (see assets/fonts/OFL.txt). -->
  <style>
    @font-face{font-family:'AHN';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
    @font-face{font-family:'AHN';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
    
    text { font-family: 'AHN', sans-serif; fill: #FFFFFF; }
    .b { font-weight: 700; } .r { font-weight: 400; }
    .soft { fill-opacity: .84; }
    .dot { fill: #FFFFFF; transform-box: fill-box; transform-origin: center;
           animation: emboss .32s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes emboss { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    .route { fill: none; stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1; animation: draw 1.5s cubic-bezier(.65,0,.35,1) .7s backwards; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    .dest { transform-box: fill-box; transform-origin: center;
            animation: arrive .5s cubic-bezier(.3,1.7,.55,1) 2.1s backwards; }
    @keyframes arrive { from { transform: scale(0); } to { transform: scale(1); } }
    .ripple { fill: none; stroke: #FFC72C; opacity: 0; transform-box: fill-box; transform-origin: center;
              animation: ripple 1.3s ease-out .3s; }
    @keyframes ripple { from { opacity: .95; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  </style>
